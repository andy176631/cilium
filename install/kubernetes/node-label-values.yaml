extraConfig: 
  labelBasedClusterPool: |-
    defaultCIDRPools:
      - 10.0.0.0/24

    nodeLabelAllocations:
      - selector:
          matchLabels:
            node-group: group1
        cidrPools:
          - 2.2.2.2/30  
          - 1.1.1.1/24
      - selector:
          matchLabels:
            dc: topology
        cidrPools:
          - 2.2.2.5/30
          - 1.1.1.1/24            
