  usage: Enable discovery of Kubernetes API groups and resources with the discovery
    API
- name: enable-k8s-cluster-network-policy
  default: "false"
  usage: Enable support for K8s ClusterNetworkPolicy
- name: enable-k8s-host-firewall-bypass
  default: "true"
  usage: Enable bypassing host firewall for Kubernetes API server access.
- name: enable-k8s-networkpolicy
  default: "true"
  usage: Enable support for K8s NetworkPolicy
- name: enable-l2-announcements
  default: "false"
  usage: Enable L2 announcements
- name: enable-l2-neigh-discovery
  default: "false"
  usage: Enables L2 neighbor discovery, even when XDP acceleration is disabled
- name: enable-l2-pod-announcements
  default: "false"
  usage: Enable announcing Pod IPs with Gratuitous ARP and NDP
- name: enable-l7-proxy
  default: "true"
  usage: Enable L7 proxy for L7 policy enforcement
- name: enable-lb-ipam
  default: "true"
  usage: Enable LB IPAM
- name: enable-local-node-route
  default: "true"
  usage: Enable installation of the route which points the allocation prefix of the
    local node
- name: enable-local-redirect-policy
  default: "false"
  usage: Enable Local Redirect Policy
- name: enable-masquerade-to-route-source
  default: "false"
  usage: Masquerade packets to the source IP provided from the routing layer rather
    than interface address
- name: enable-mke
  default: "false"
  usage: Enable BPF kube-proxy replacement for MKE environments
- name: enable-monitor
  default: "true"
  usage: Enable the monitor unix domain socket server
- name: enable-nat46x64-gateway
  default: "false"
  usage: Enable NAT46 and NAT64 gateway
- name: enable-no-service-endpoints-routable
  default: "true"
  usage: Enable routes when service has 0 endpoints
- name: enable-node-ipam
  default: "false"
  usage: Enable Node IPAM
- name: enable-node-selector-labels
  default: "false"
  usage: Enable use of node label based identity
- name: enable-non-default-deny-policies
  default: "true"
  usage: Enable use of non-default-deny policies
- name: enable-pmtu-discovery
  default: "false"
  usage: Enable path MTU discovery to send ICMP fragmentation-needed replies to the
    client
- name: enable-policy
  default: default
  usage: Enable policy enforcement
- name: enable-policy-secrets-sync
  default: "false"
  usage: Enables Envoy secret sync for Secrets used in CiliumNetworkPolicy and CiliumClusterwideNetworkPolicy
- name: enable-remote-node-masquerade
  default: "false"
  usage: Masquerade packets from endpoints leaving the host destined to a remote node
    in BPF masquerading mode. This option requires to set enable-bpf-masquerade to
    true.
- name: enable-route-mtu-for-cni-chaining
  default: "false"
  usage: Enable route MTU for pod netns when CNI chaining is used
- name: enable-sctp
  default: "false"
  usage: Enable SCTP support (beta)
- name: enable-service-topology
  default: "false"
  usage: Enable support for service topology aware hints
- name: enable-srv6
  default: "false"
  usage: Enable SRv6 support (beta)
- name: enable-stale-cilium-endpoint-cleanup
  default: "true"
  usage: Enable running cleanup init procedure of local CiliumEndpoints which are
    not being managed.
- name: enable-standalone-dns-proxy
  default: "false"
  usage: Enables standalone DNS proxy
- name: enable-tcx
  default: "true"
  usage: Attach endpoint programs using tcx if supported by the kernel
- name: enable-tracing
  default: "false"
  usage: Enable tracing while determining policy (debugging)
- name: enable-unreachable-routes
  default: "false"
  usage: Add unreachable routes on pod deletion
- name: enable-vtep
  default: "false"
  usage: Enable  VXLAN Tunnel Endpoint (VTEP) Integration (beta)
- name: enable-well-known-identities
  default: "true"
  usage: Enable well-known identities for known Kubernetes components
- name: enable-wireguard
  default: "false"
  usage: Enable WireGuard
- name: enable-xdp-prefilter
  default: "false"
  usage: Enable XDP prefiltering
- name: enable-xt-socket-fallback
  default: "true"
  usage: Enable fallback for missing xt_socket module
- name: enable-ztunnel
  default: "false"
  usage: Use zTunnel as Cilium's encryption infrastructure
- name: encrypt-node
  default: "false"
  usage: Enables encrypting traffic from non-Cilium pods and host networking (only
    supported with WireGuard, beta)
- name: encryption-strict-egress-allow-remote-node-identities
  default: "false"
  usage: Allows unencrypted traffic from pods to remote node identities within the
    strict mode CIDR. This is required when tunneling is used or direct routing is
    used and the node CIDR and pod CIDR overlap.
- name: encryption-strict-egress-cidr
  default: ""
  usage: In strict-mode-egress encryption, all unencrypted traffic coming from this
    CIDR and going to this same CIDR will be dropped.
- name: endpoint-bpf-prog-watchdog-interval
  default: 30s
  usage: Interval to trigger endpoint BPF programs load check watchdog
- name: endpoint-gc-interval
  default: 5m0s
  usage: Periodically monitor local endpoint health via link status on this interval
    and garbage collect them if they become unhealthy, set to 0 to disable
- name: endpoint-policy-update-timeout
  default: 10s
  usage: Timeout duration for Endpoint policy updates
- name: endpoint-queue-size
  default: "25"
  usage: Size of EventQueue per-endpoint
- name: endpoint-regen-interval
  default: 2m0s
  usage: Periodically recalculate and re-apply endpoint configuration. Set to 0 to
    disable
- name: eni-delete-on-termination
  default: "true"
  usage: Whether the ENI should be deleted when the associated instance is terminated
    at the node level
- name: eni-disable-prefix-delegation
  default: "false"
  usage: Whether ENI prefix delegation should be disabled on this node at the node
    level
- name: eni-exclude-interface-tags
  default: '[]'
  usage: List of tags to use when excluding ENIs for Cilium IP allocation at the node
    level
- name: eni-first-interface-index
  default: "0"
  usage: Index of the first ENI to use for IP allocation at the node level
- name: eni-security-group-tags
  default: '[]'
  usage: List of tags to use when evaluating what AWS security groups to use for the
    ENI at the node level
- name: eni-security-groups
  default: '[]'
  usage: List of security groups to attach to any ENI that is created and attached
    to the instance at the node level
- name: eni-subnet-ids
  default: '[]'
  usage: List of subnet ids to use when evaluating what AWS subnets to use for ENI
    and IP allocation at the node level
- name: eni-subnet-tags
  default: '[]'
  usage: List of tags to use when evaluating what AWS subnets to use for ENI and IP
    allocation at the node level
- name: eni-use-primary-address
  default: "false"
  usage: Whether an ENI's primary address should be available for allocations on the
    node at the node level
- name: envoy-access-log-buffer-size
  default: "4096"
  usage: Envoy access log buffer size in bytes
- name: envoy-access-log-enabled
  default: "true"
  usage: Enable access log forwarding for integration with Hubble.
- name: envoy-base-id
  default: "0"
  usage: Envoy base ID
- name: envoy-config-retry-interval
  default: 15s
  usage: Interval in which an attempt is made to reconcile failed EnvoyConfigs. If
    the duration is zero, the retry is deactivated.
- name: envoy-config-timeout
  default: 2m0s
  usage: Timeout that determines how long to wait for Envoy to N/ACK CiliumEnvoyConfig
    resources
- name: envoy-default-log-level
  default: ""
  usage: Default log level of Envoy application log that is configured if Cilium debug
    / verbose logging isn't enabled. If not defined, the default log level of the
    Cilium Agent is used.
- name: envoy-http-upstream-linger-timeout
  default: "-1"
  usage: Time in seconds to block Envoy worker thread while an upstream HTTP connection
    is closing. If set to 0, the connection is closed immediately (with TCP RST).
    If set to -1, the connection is closed asynchronously in the background.
- name: envoy-keep-cap-netbindservice
  default: "false"
  usage: Keep capability NET_BIND_SERVICE for Envoy process
- name: envoy-log
  default: ""
  usage: Path to a separate Envoy log file, if any
- name: envoy-node-locality-enabled
  default: "false"
  usage: Enable Envoy node-locality support for zone-aware routing
- name: envoy-policy-restore-timeout
  default: 3m0s
  usage: Maximum time to wait for endpoint policy restoration before starting serving
    resources to Envoy
- name: envoy-secrets-namespace
  default: ""
  usage: EnvoySecretsNamespace is the namespace having secrets used by CEC
- name: exclude-local-address
  default: '[]'
  usage: Exclude CIDR from being recognized as local address
- name: exclude-node-label-patterns
  default: '[]'
  usage: List of k8s node label regex patterns to be excluded from CiliumNode
- name: external-envoy-proxy
  default: "false"
  usage: whether the Envoy is deployed externally in form of a DaemonSet or not
- name: fib-table-id-annotation
  default: "false"
  usage: Enable parsing of the network.cilium.io/fib-table-id pod annotation for pod
    egress routing
- name: fixed-identity-mapping
  default: ""
  usage: Key-value for the fixed identity mapping which allows to use reserved label
    for fixed identities, e.g. 128=kv-store,129=kube-dns
- name: force-device-detection
  default: "false"
  usage: Forces the auto-detection of devices, even if specific devices are explicitly
    listed
- name: fqdn-regex-compile-lru-size
  default: "1024"
  usage: Size of the FQDN regex compilation LRU. Useful for heavy but repeated DNS
    L7 rules with MatchName or MatchPattern
- name: gateway-api-secrets-namespace
  default: ""
  usage: GatewayAPISecretsNamespace is the namespace having tls secrets used by CEC,
    originating from Gateway API
- name: gops-port
  default: "9890"
  usage: Port for gops server to listen on
- name: health-check-icmp-failure-threshold
  default: "3"
  usage: Number of ICMP requests sent for each run of the health checker. If at least
    one ICMP response is received, the node or endpoint is marked as healthy.
- name: hive-log-threshold
  default: 100ms
  usage: Time limit after which a slow hook is logged at Info level
- name: hive-start-timeout
  default: 5m0s
  usage: Maximum time to wait for startup hooks to complete before timing out
- name: hive-stop-timeout
  default: 1m0s
  usage: Maximum time to wait for stop hooks to complete before timing out
- name: http-idle-timeout
  default: "0"
  usage: Time after which a non-gRPC HTTP stream is considered failed unless traffic
    in the stream has been processed (in seconds); defaults to 0 (unlimited)
- name: http-max-grpc-timeout
  default: "0"
  usage: Time after which a forwarded gRPC request is considered failed unless completed
    (in seconds). A "grpc-timeout" header may override this with a shorter value;
    defaults to 0 (unlimited)
- name: http-normalize-path
  default: "true"
  usage: Use Envoy HTTP path normalization options, which currently includes RFC 3986
    path normalization, Envoy merge slashes option, and unescaping and redirecting
    for paths that contain escaped slashes. These are necessary to keep path based
    access control functional, and should not interfere with normal operation. Set
    this to false only with caution.
- name: http-request-timeout
  default: "3600"
  usage: Time after which a forwarded HTTP request is considered failed unless completed
    (in seconds); Use 0 for unlimited
- name: http-retry-count
  default: "3"
  usage: Number of retries performed after a forwarded request attempt fails
- name: http-retry-timeout
  default: "0"
  usage: Time after which a forwarded but uncompleted request is retried (connection
    failures are retried immediately); defaults to 0 (never)
- name: http-stream-idle-timeout
  default: "300"
  usage: Set Envoy the amount of time in seconds that the connection manager will
    allow a stream to exist with no upstream or downstream activity.
- name: hubble-disable-tls
  default: "true"
  usage: Allow Hubble server to run on the given listen address without TLS.
- name: hubble-drop-events
  default: "false"
  usage: Emit packet drop Events related to pods (alpha)
- name: hubble-drop-events-extended
  default: "false"
  usage: Include L4 network policies in drop event message
- name: hubble-drop-events-interval
  default: 2m0s
  usage: Minimum time between emitting same events
- name: hubble-drop-events-rate-limit
  default: "1"
  usage: Rate limit for the drop event emitter in events per second (0 for no rate
    limit)
- name: hubble-drop-events-reasons
  default: '[auth_required,policy_denied]'
  usage: Drop reasons to emit events for
- name: hubble-dynamic-metrics-config-path
  default: ""
  usage: Filepath with dynamic configuration of hubble metrics.
- name: hubble-event-buffer-capacity
  default: "4095"
  usage: 'Capacity of Hubble events buffer. The provided value must be one less than
    an integer power of two and no larger than 65535 (ie: 1, 3, ..., 2047, 4095, ...,
    65535)'
- name: hubble-event-queue-size
  default: "0"
  usage: Buffer size of the channel to receive monitor events.
- name: hubble-export-aggregation-interval
  default: 0s
  usage: Interval at which to aggregate before exporting Hubble flows. 0s disables
    aggregation.
- name: hubble-export-allowlist
  default: ""
  usage: Specify allowlist as JSON encoded FlowFilters to Hubble exporter.
- name: hubble-export-denylist
  default: ""
  usage: Specify denylist as JSON encoded FlowFilters to Hubble exporter.
- name: hubble-export-fieldaggregate
  default: '[]'
  usage: Specify list of fields to use for aggregation in Hubble exporter. Empty list
    disables aggregation.
- name: hubble-export-fieldmask
  default: '[]'
  usage: Specify list of fields to use for field mask in Hubble exporter.
- name: hubble-export-file-compress
  default: "false"
  usage: Compress rotated Hubble export files.
- name: hubble-export-file-max-backups
  default: "5"
  usage: Number of rotated Hubble export files to keep.
- name: hubble-export-file-max-size-mb
  default: "10"
  usage: Size in MB at which to rotate Hubble export file.
- name: hubble-export-file-path
  default: ""
  usage: Filepath to write Hubble events to. By specifying `stdout` the flows are
    logged instead of written to a rotated file.
- name: hubble-flowlogs-config-path
  default: ""
  usage: Filepath with configuration of hubble flowlogs
- name: hubble-listen-address
  default: ""
  usage: An additional address for Hubble server to listen to, e.g. ":4244"
- name: hubble-lost-event-send-interval
  default: 1s
  usage: Interval at which lost events are sent from the Observer server, if any.
- name: hubble-metrics
  default: ""
  usage: List of Hubble metrics to enable.
- name: hubble-metrics-server
  default: ""
  usage: Address to serve Hubble metrics on.
- name: hubble-metrics-server-enable-tls
  default: "false"
  usage: Run the Hubble metrics server on the given listen address with TLS.
- name: hubble-metrics-server-tls-cert-file
  default: ""
  usage: Path to the public key file for the Hubble metrics server. The file must
    contain PEM encoded data.
- name: hubble-metrics-server-tls-client-ca-files
  default: '[]'
  usage: Paths to one or more public key files of client CA certificates to use for
    TLS with mutual authentication (mTLS). The files must contain PEM encoded data.
    When provided, this option effectively enables mTLS.
- name: hubble-metrics-server-tls-key-file
  default: ""
  usage: Path to the private key file for the Hubble metrics server. The file must
    contain PEM encoded data.
- name: hubble-monitor-events
  default: '[]'
  usage: 'Cilium monitor events for Hubble to observe: [drop debug capture trace policy-verdict
    trace-sock l7 agent]. By default, Hubble observes all monitor events.'
- name: hubble-network-policy-correlation-enabled
  default: "true"
  usage: Enable network policy correlation of Hubble flows
- name: hubble-prefer-ipv6
  default: "false"
  usage: Prefer IPv6 addresses for announcing nodes when both address types are available.
- name: hubble-redact-enabled
  default: "false"
  usage: Hubble redact sensitive information from flows
- name: hubble-redact-http-headers-allow
  default: '[]'
  usage: HTTP headers to keep visible in flows
- name: hubble-redact-http-headers-deny
  default: '[]'
  usage: HTTP headers to redact from flows
- name: hubble-redact-http-urlquery
  default: "false"
  usage: Hubble redact http URL query from flows
- name: hubble-redact-http-userinfo
  default: "true"
  usage: Hubble redact http user info from flows
- name: hubble-skip-unknown-cgroup-ids
  default: "true"
  usage: Skip Hubble events with unknown cgroup ids
- name: hubble-socket-path
  default: /var/run/cilium/hubble.sock
  usage: Set hubble's socket path to listen for connections
- name: hubble-tls-cert-file
  default: ""
  usage: Path to the public key file for the Hubble server. The file must contain
    PEM encoded data.
- name: hubble-tls-client-ca-files
  default: '[]'
  usage: Paths to one or more public key files of client CA certificates to use for
    TLS with mutual authentication (mTLS). The files must contain PEM encoded data.
    When provided, this option effectively enables mTLS.
- name: hubble-tls-key-file
  default: ""
  usage: Path to the private key file for the Hubble server. The file must contain
    PEM encoded data.
- name: identity-allocation-mode
  default: kvstore
  usage: Method to use for identity allocation
- name: identity-allocation-sync-interval
  default: 5m0s
  usage: Periodic synchronization interval of the allocated identities
- name: identity-allocation-timeout
  default: 2m0s
  usage: Timeout for identity allocation operations
- name: identity-change-grace-period
  default: 5s
  usage: Time to wait before using new identity on endpoint identity change
- name: identity-management-mode
  default: agent
  usage: Configure whether Cilium Identities are managed by cilium-agent, cilium-operator,
    or both
- name: identity-max-jitter
  default: 30s
  usage: Maximum jitter time to begin processing CiliumIdentity updates
- name: identity-restore-grace-period
  default: 30s
  usage: Time to wait before releasing unused restored CIDR identities during agent
    restart
- name: ignore-flags-drift-checker
  default: '[]'
  usage: Ignores specified flags during drift checking
- name: ingress-secrets-namespace
  default: ""
  usage: IngressSecretsNamespace is the namespace having tls secrets used by CEC,
    originating from Ingress controller
- name: install-iptables-rules
  default: "true"
  usage: Install base iptables rules for cilium to mainly interact with kube-proxy
    (and masquerading)
- name: install-no-conntrack-iptables-rules
  default: "false"
  usage: Install Iptables rules to skip netfilter connection tracking on all pod traffic.
