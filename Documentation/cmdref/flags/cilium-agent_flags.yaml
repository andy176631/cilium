    KPR mode. Moreover, this option cannot be enabled when Cilium is running in a
    managed Kubernetes environment or in a chained CNI setup.
- name: install-uplink-routes-for-delegated-ipam
  default: "false"
  usage: Install ingress/egress routes through uplink on host for Pods when working
    with delegated IPAM plugin.
- name: ip-masq-agent-config-path
  default: /etc/config/ip-masq-agent
  usage: ip-masq-agent configuration file path
- name: ip-tracing-option-type
  default: "0"
  usage: Specifies what IPv4 option type should be used to extract trace information
    from a packet; a value of 0 (default) disables IP tracing.
- name: ipam
  default: cluster-pool
  usage: Backend to use for IPAM
- name: ipam-cilium-node-update-rate
  default: 15s
  usage: Maximum rate at which the CiliumNode custom resource is updated
- name: ipam-default-ip-pool
  default: default
  usage: Name of the default IP Pool when using multi-pool
- name: ipam-max-allocate
  default: "0"
  usage: Maximum number of IPs that can be allocated at the node level
- name: ipam-min-allocate
  default: "0"
  usage: Minimum number of IPs that must be allocated when the node is first bootstrapped
