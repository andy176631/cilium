- name: ipsec-key-file
  default: ""
  usage: Path to IPsec key file
- name: ipsec-key-rotation-duration
  default: 5m0s
  usage: Maximum duration of the IPsec key rotation. The previous key will be removed
    after that delay.
- name: iptables-lock-timeout
  default: 5s
  usage: Time to pass to each iptables invocation to wait for xtables lock acquisition
- name: iptables-random-fully
  default: "false"
  usage: Set iptables flag random-fully on masquerading rules
- name: ipv4-native-routing-cidr
  default: ""
  usage: Allows to explicitly specify the IPv4 CIDR for native routing. When specified,
    Cilium assumes networking for this CIDR is preconfigured and hands traffic destined
    for that range to the Linux network stack without applying any SNAT. Generally
    speaking, specifying a native routing CIDR implies that Cilium can depend on the
    underlying networking stack to route packets to their destination. To offer a
    concrete example, if Cilium is configured to use direct routing and the Kubernetes
    CIDR is included in the native routing CIDR, the user must configure the routes
    to reach pods, either manually or by setting the auto-direct-node-routes flag.
- name: ipv4-node
  default: auto
  usage: IPv4 address of node
- name: ipv4-pod-subnets
  default: '[]'
  usage: List of IPv4 pod subnets to preconfigure for encryption
- name: ipv4-range
  default: auto
  usage: Per-node IPv4 endpoint prefix, e.g. 10.16.0.0/16
- name: ipv4-service-loopback-address
  default: 169.254.42.1
  usage: IPv4 source address to use for SNAT when a Pod talks to itself over a Service.
- name: ipv4-service-range
  default: auto
  usage: Kubernetes IPv4 services CIDR if not inside cluster prefix
- name: ipv6-cluster-alloc-cidr
  default: f00d::/64
  usage: IPv6 /64 CIDR used to allocate per node endpoint /96 CIDR
- name: ipv6-mcast-device
  default: ""
  usage: Device that joins a Solicited-Node multicast group for IPv6
- name: ipv6-native-routing-cidr
  default: ""
  usage: Allows to explicitly specify the IPv6 CIDR for native routing. When specified,
    Cilium assumes networking for this CIDR is preconfigured and hands traffic destined
    for that range to the Linux network stack without applying any SNAT. Generally
    speaking, specifying a native routing CIDR implies that Cilium can depend on the
    underlying networking stack to route packets to their destination. To offer a
    concrete example, if Cilium is configured to use direct routing and the Kubernetes
    CIDR is included in the native routing CIDR, the user must configure the routes
    to reach pods, either manually or by setting the auto-direct-node-routes flag.
- name: ipv6-node
  default: auto
  usage: IPv6 address of node
- name: ipv6-pod-subnets
  default: '[]'
  usage: List of IPv6 pod subnets to preconfigure for encryption
- name: ipv6-range
  default: auto
  usage: Per-node IPv6 endpoint prefix, e.g. fd02:1:1::/96
- name: ipv6-service-loopback-address
  default: fe80::1
  usage: IPv6 source address to use for SNAT when a Pod talks to itself over a Service.
- name: ipv6-service-range
  default: auto
  usage: Kubernetes IPv6 services CIDR if not inside cluster prefix
- name: k8s-api-server-urls
  default: '[]'
  usage: Kubernetes API server URLs
- name: k8s-client-burst
  default: "20"
  usage: Burst value allowed for the K8s client
- name: k8s-client-connection-keep-alive
  default: 30s
  usage: Configures the keep alive duration of K8s client connections. K8 client is
    disabled if the value is set to 0
- name: k8s-client-connection-timeout
  default: 30s
  usage: Configures the timeout of K8s client connections. K8s client is disabled
    if the value is set to 0
- name: k8s-client-qps
  default: "10"
  usage: Queries per second limit for the K8s client
- name: k8s-heartbeat-timeout
  default: 30s
  usage: Configures the timeout for api-server heartbeat, set to 0 to disable
- name: k8s-kubeconfig-path
  default: ""
  usage: Absolute path of the kubernetes kubeconfig file
- name: k8s-namespace
  default: ""
  usage: Name of the Kubernetes namespace in which Cilium is deployed in
- name: k8s-require-ipv4-pod-cidr
  default: "false"
  usage: Require IPv4 PodCIDR to be specified in node resource
- name: k8s-require-ipv6-pod-cidr
  default: "false"
  usage: Require IPv6 PodCIDR to be specified in node resource
- name: k8s-service-proxy-name
  default: ""
  usage: Value of K8s service-proxy-name label for which Cilium handles the services
    (empty = all services without service.kubernetes.io/service-proxy-name label)
- name: k8s-sync-timeout
  default: 3m0s
  usage: Timeout after last K8s event for synchronizing k8s resources before exiting
- name: keep-config
  default: "false"
  usage: When restoring state, keeps containers' configuration in place
- name: kube-proxy-replacement
  default: "false"
  usage: Enable kube-proxy replacement
- name: kube-proxy-replacement-healthz-bind-address
  default: ""
