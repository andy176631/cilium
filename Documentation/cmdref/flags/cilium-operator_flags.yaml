- name: enable-ciliumnode-crd
  default: "true"
  usage: Enable CiliumNode CRD
- name: enable-egress-gateway
  default: "false"
  usage: ""
- name: enable-gateway-api-alpn
  default: "false"
  usage: Enables exposing ALPN with HTTP2 and HTTP/1.1 support for Gateway API
- name: enable-gateway-api-app-protocol
  default: "false"
  usage: Enables Backend Protocol selection (GEP-1911) for Gateway API via appProtocol
- name: enable-gateway-api-proxy-protocol
  default: "false"
  usage: Enable proxy protocol for all GatewayAPI listeners. Note that _only_ Proxy
