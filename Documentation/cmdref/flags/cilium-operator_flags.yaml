- name: enable-gops
  default: "true"
  usage: Enable gops server
- name: enable-icmp-rules
  default: "true"
  usage: Enable ICMP-based rule support for Cilium Network Policies
- name: enable-ingress-controller
  default: "false"
  usage: Enables cilium ingress controller. This must be enabled along with enable-envoy-config
