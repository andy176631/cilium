- name: alibaba-cloud-release-excess-ips
  default: "false"
  usage: Enable releasing excess free IP addresses from Alibaba Cloud ENI.
- name: alibaba-cloud-vpc-id
  default: ""
  usage: Specific VPC ID for AlibabaCloud ENI. If not set use same VPC as operator
- name: auto-create-cilium-pod-ip-pools
  default: '[]'
  usage: Automatically create CiliumPodIPPool resources on startup. Specify pools
    in the form of <pool>=ipv4-cidrs:<cidr>,[<cidr>...];ipv4-mask-size:<size> (multiple
    pools can also be passed by repeating the CLI flag)
- name: aws-enable-prefix-delegation
  default: "false"
  usage: Allows operator to allocate prefixes to ENIs instead of individual IP addresses
- name: aws-max-results-per-call
  default: "0"
  usage: Maximum results per AWS API call for DescribeNetworkInterfaces and DescribeSecurityGroups.
    Set to 0 to let AWS determine optimal page size (default). If set to 0 and AWS
    returns OperationNotPermitted errors, automatically switches to 1000 for all future
    requests
- name: aws-release-excess-ips
  default: "false"
  usage: Enable releasing excess free IP addresses from AWS ENI.
- name: aws-use-primary-address
  default: "false"
  usage: Allows for using primary address of the ENI for allocations on the node
- name: azure-resource-group
  default: ""
  usage: Resource group to use for Azure IPAM
- name: azure-subscription-id
  default: ""
  usage: Subscription ID to access Azure API
- name: azure-use-primary-address
  default: "false"
  usage: Use Azure IP address from interface's primary IPConfigurations
- name: azure-user-assigned-identity-id
  default: ""
  usage: ID of the user assigned identity used to auth with the Azure API
- name: ces-controller-mode
  default: default
  usage: CES controller operation mode. Can be 'default' or 'slim'
- name: ces-max-ciliumendpoints-per-ces
  default: "100"
  usage: Maximum number of CiliumEndpoints allowed in a CES
- name: ces-rate-limits
  default: '[{"nodes":0,"limit":10,"burst":20}]'
  usage: Configure rate limits for the CES controller. Accepts a list of rate limit
    configurations, must be a JSON formatted string.
- name: cilium-endpoint-gc-interval
  default: 5m0s
  usage: GC interval for cilium endpoints
- name: cilium-pod-labels
  default: k8s-app=cilium
  usage: Cilium Pod's labels selector. Used to detect if a Cilium pod is running to
    remove the node taints where its running and set NetworkUnavailable to false
- name: cilium-pod-namespace
  default: ""
  usage: Name of the Kubernetes namespace in which Cilium is deployed in. Defaults
    to the same namespace defined in k8s-namespace
- name: cluster-id
  default: "0"
  usage: Unique identifier of the cluster
- name: cluster-name
  default: default
  usage: Name of the cluster. It must consist of at most 32 lower case alphanumeric
    characters and '-', start and end with an alphanumeric character.
- name: cluster-pool-ipv4-cidr
  default: '[]'
  usage: IPv4 CIDR Range for Pods in cluster. Requires 'ipam=cluster-pool' and 'enable-ipv4=true'
- name: cluster-pool-ipv4-mask-size
  default: "24"
  usage: Mask size for each IPv4 podCIDR per node. Requires 'ipam=cluster-pool' and
    'enable-ipv4=true'
- name: cluster-pool-ipv6-cidr
  default: '[]'
  usage: IPv6 CIDR Range for Pods in cluster. Requires 'ipam=cluster-pool' and 'enable-ipv6=true'
- name: cluster-pool-ipv6-mask-size
  default: "112"
  usage: Mask size for each IPv6 podCIDR per node. Requires 'ipam=cluster-pool' and
    'enable-ipv6=true'
- name: clustermesh-cache-ttl
  default: 0s
  usage: The time to live for the cache of a remote cluster after connectivity is
    lost. If the connection is not re-established within this duration, the cached
    data is revoked to prevent stale state. If not specified or set to 0s, the cache
    is never revoked.
- name: clustermesh-concurrent-service-endpoint-syncs
  default: "5"
  usage: The number of remote cluster service syncing operations that will be done
    concurrently. Larger number = faster endpoint slice updating, but more CPU (and
    network) load.
- name: clustermesh-config
  default: ""
  usage: Path to the ClusterMesh configuration directory
- name: clustermesh-default-global-namespace
  default: "true"
  usage: Mark all namespaces as global by default unless overridden by annotation
- name: clustermesh-enable-endpoint-sync
  default: "false"
  usage: Whether or not the endpoint slice cluster mesh synchronization is enabled.
- name: clustermesh-enable-mcs-api
  default: "false"
  usage: Enable Cluster Mesh MCS-API support
- name: clustermesh-endpoint-updates-batch-period
  default: 500ms
  usage: The length of endpoint slice updates batching period for remote cluster services.
    Processing of pod changes will be delayed by this duration to join them with potential
    upcoming updates and reduce the overall number of endpoints updates. Larger number
    = higher endpoint programming latency, but lower number of endpoints revision
    generated.
- name: clustermesh-endpoints-per-slice
  default: "100"
  usage: The maximum number of endpoints that will be added to a remote cluster's
    EndpointSlice . More endpoints per slice will result in less endpoint slices,
    but larger resources.
- name: clustermesh-mcs-api-install-crds
  default: "true"
  usage: Install and manage the MCS API CRDs. Only applicable if MCS API support is
    enabled.
- name: clustermesh-sync-timeout
  default: 1m0s
  usage: Timeout waiting for the initial synchronization of information from remote
    clusters
- name: cmdref
  default: ""
  usage: Path to cmdref output directory
- name: config
  default: ""
  usage: Configuration file (default "$HOME/ciliumd.yaml")
- name: config-dir
  default: ""
  usage: Configuration directory that contains a file for each option
- name: controller-group-metrics
  default: '[]'
  usage: List of controller group names for which to enable metrics. Accepts 'all'
    and 'none'. The set of controller group names available is not guaranteed to be
    stable between Cilium versions.
- name: debug
  default: "false"
  usage: Enable debugging mode
- name: default-lb-service-ipam
  default: lbipam
  usage: 'Indicates the default LoadBalancer Service IPAM when no LoadBalancer class
    is set.Applicable values: lbipam, nodeipam, none'
- name: disable-endpoint-crd
  default: "false"
  usage: ""
- name: double-write-metric-reporter-interval
  default: 1m0s
  usage: Refresh interval for the Double Write Metric Reporter
- name: ec2-api-endpoint
  default: ""
  usage: AWS API endpoint for the EC2 service
- name: enable-cilium-clusterwide-network-policy
  default: "true"
  usage: Enable support for Cilium Clusterwide Network Policy
- name: enable-cilium-endpoint-slice
  default: "false"
  usage: If set to true, the CiliumEndpointSlice feature is enabled. If any CiliumEndpoints
    resources are created, updated, or deleted in the cluster, all those changes are
    broadcast as CiliumEndpointSlice updates to all of the Cilium agents.
- name: enable-cilium-network-policy
  default: "true"
  usage: Enable support for Cilium Network Policy
- name: enable-cilium-operator-server-access
  default: '[*]'
  usage: List of cilium operator APIs which are administratively enabled. Supports
