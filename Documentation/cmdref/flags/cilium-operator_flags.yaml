- name: enable-ipsec
  default: "false"
  usage: Enable IPsec
- name: enable-ipv4
  default: "true"
  usage: Enable IPv4 support
- name: enable-ipv6
  default: "true"
  usage: Enable IPv6 support
- name: enable-k8s
  default: "true"
  usage: Enable the k8s clientset
- name: enable-k8s-api-discovery
  default: "false"
  usage: Enable discovery of Kubernetes API groups and resources with the discovery
